
name: Smart Cafe CI/CD Pipeline
on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:

  build-and-deploy:

    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Docker Buildx
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Login to Docker Hub
      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. Build and Push Docker Image
      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/akhilehs-crud:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/akhilehs-crud:${{ github.sha }}

      # 5. Deploy to AWS EC2
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/akhilehs-crud:latest
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE
          script: |
            docker pull "$IMAGE"

            docker stop smartcafe || true
            docker rm smartcafe || true

            docker run -d \
              --name smartcafe \
              --restart unless-stopped \
              -p 8080:8080 \
              --env-file /opt/smartcafe/.env \
              "$IMAGE"

            docker image prune -f

            echo "Deployment successful!"
